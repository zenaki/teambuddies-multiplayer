name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:static
        env: # optional: set these as repository variables/secrets for your own TURN/PeerServer
          TURN_URL: ${{ vars.TURN_URL }}
          TURN_USER: ${{ vars.TURN_USER }}
          TURN_PASS: ${{ secrets.TURN_PASS }}
          PEER_HOST: ${{ vars.PEER_HOST }}
      # optional encrypted disc (branch "disc-data"); delete that branch to take the disc down
      - name: Add encrypted disc
        run: |
          if git ls-remote --exit-code origin disc-data >/dev/null 2>&1; then
            git fetch --depth=1 origin disc-data
            mkdir -p dist/disc && git archive FETCH_HEAD disc | tar -x -C dist
            ls -la dist/disc | head
          else
            echo "no disc-data branch: site has no server disc"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
