<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Buddies Web</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Team Buddies">
<meta name="theme-color" content="#12141a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><h1>Team Buddies Web</h1><span class="sp"></span><small>PS1 · hingga 4 pemain</small></header>
<main class="wrap grid half">
  <section class="card">
    <h2>Jadi host</h2>
    <p class="muted">Muat disc Team Buddies milikmu sendiri dari komputer. Game berjalan di browsermu, lalu layarnya di-stream ke teman-teman. File game tidak pernah di-upload ke server.</p>
    <a class="btn primary" href="host.html">Buat room</a>
  </section>
  <section class="card">
    <h2>Gabung ke room</h2>
    <p class="muted">Masukkan kode dari host. Kamu tidak perlu file game.</p>
    <form action="play.html" method="get">
      <label for="room">Kode room</label>
      <input id="room" name="room" class="code" type="text" maxlength="5" autocomplete="off" required>
      <label for="name">Nama</label>
      <input id="name" name="name" type="text" maxlength="24" placeholder="Player">
      <p><button class="primary" type="submit">Gabung</button></p>
    </form>
  </section>
</main>
</body>
</html>
